<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuentas de casa</title>
<style>
  /* ============================================================
     CUENTAS DE CASA — finanzas del hogar de Nico y Mari
     Mes como contenedor. 4 pestañas: Resumen, Compras, Cuentas, Config.
     Paleta cálida tipo café · Nico verde · Mari morado · Ambos dorado
     ============================================================ */
  :root{
    --bg:#f3efe7; --surface:#fbf9f4; --surface-2:#f7f3ea;
    --ink:#211f19; --ink-soft:#6b6558; --ink-faint:#9a9384;
    --line:#e4ddcf; --line-soft:#efe9dd; --dark:#1c1a15;
    --gold:#9a7b3f; --gold-soft:#efe4cf;
    --nico:#167a5f; --nico-soft:#d7eae3; --nico-ink:#0f5241;
    --mari:#8c3fa8; --mari-soft:#eaddf1; --mari-ink:#5f2a73;
    --ambos:#b5801f; --ambos-soft:#f1e6cd; --ambos-ink:#7c5712;
    --ok:#167a5f; --warn:#c0603a; --warn-soft:#f3ddd2; --amber:#b5801f;
    --radius:18px; --radius-sm:11px;
    --shadow:0 1px 2px rgba(60,50,30,.05),0 3px 10px rgba(60,50,30,.045);
    --shadow-lg:0 2px 4px rgba(60,50,30,.06),0 12px 32px rgba(60,50,30,.09);
    --sans:'Darker Grotesque',system-ui,sans-serif;
    --body:'Inter',system-ui,-apple-system,sans-serif;
    --chart-grid:#e9e2d4;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#15130e; --surface:#201d17; --surface-2:#1a1812;
    --ink:#f0ece2; --ink-soft:#a8a192; --ink-faint:#766e60;
    --line:#332e24; --line-soft:#282319; --dark:#0d0b07;
    --gold:#c9a860; --gold-soft:#39301f;
    --nico:#3cb492; --nico-soft:#133a2e; --nico-ink:#7fd6bd;
    --mari:#c178dd; --mari-soft:#331f3d; --mari-ink:#dcb3ec;
    --ambos:#d4a94f; --ambos-soft:#3a2f18; --ambos-ink:#e8cd8f;
    --ok:#3cb492; --warn:#e08a63; --warn-soft:#3a2418; --amber:#d4a94f;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 3px 10px rgba(0,0,0,.25);
    --shadow-lg:0 2px 4px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.4);
    --chart-grid:#2e2a20;
    color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#15130e; --surface:#201d17; --surface-2:#1a1812;
    --ink:#f0ece2; --ink-soft:#a8a192; --ink-faint:#766e60;
    --line:#332e24; --line-soft:#282319; --dark:#0d0b07;
    --gold:#c9a860; --gold-soft:#39301f;
    --nico:#3cb492; --nico-soft:#133a2e; --nico-ink:#7fd6bd;
    --mari:#c178dd; --mari-soft:#331f3d; --mari-ink:#dcb3ec;
    --ambos:#d4a94f; --ambos-soft:#3a2f18; --ambos-ink:#e8cd8f;
    --ok:#3cb492; --warn:#e08a63; --warn-soft:#3a2418; --amber:#d4a94f;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 3px 10px rgba(0,0,0,.25);
    --shadow-lg:0 2px 4px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.4);
    --chart-grid:#2e2a20;
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
  h1,h2,h3,h4{font-family:var(--sans);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
  button{font-family:inherit}
  input,select{font-family:inherit}
  .tnum,.num{font-variant-numeric:tabular-nums}
  [hidden]{display:none!important}

  /* ===== lock screen ===== */
  #lock{position:fixed;inset:0;background:var(--dark);display:flex;align-items:center;justify-content:center;z-index:100;padding:24px}
  .lock-card{background:var(--surface);border-radius:var(--radius);padding:34px 30px;max-width:360px;width:100%;box-shadow:var(--shadow-lg);text-align:center}
  .lock-card .eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .lock-card h1{font-size:34px;margin:6px 0 4px;color:var(--ink)}
  .lock-card h1 span{color:var(--ink-faint);font-weight:500}
  .lock-card p{color:var(--ink-soft);font-size:14px;margin:0 0 20px}
  .lock-card input{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:16px;background:var(--bg);color:var(--ink);text-align:center;margin-bottom:12px}
  .lock-card input:focus{outline:none;border-color:var(--gold)}

  /* ===== top bar ===== */
  .topbar{background:var(--dark);color:#f0ece2}
  .topbar-inner{max-width:1120px;margin:0 auto;padding-block:18px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
  .brand .eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .brand h1{font-size:32px;line-height:1;color:#fff;margin-top:2px}
  .brand h1 span{color:#8c8578;font-weight:500}
  .status{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .online{display:flex;align-items:center;gap:7px;font-size:13px;color:#b8b0a0}
  .dot-live{width:8px;height:8px;border-radius:50%;background:#3cb492;transition:background .3s}
  .dot-live.off{background:#c0603a}
  .dot-live.wait{background:#b5801f}
  .month-nav{display:flex;align-items:center;background:rgba(255,255,255,.08);border-radius:999px;padding:4px}
  .month-nav button{background:none;border:none;color:#d8d0c0;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center}
  .month-nav button:hover{background:rgba(255,255,255,.12)}
  .month-nav .label{font-weight:600;font-size:14px;padding:0 12px;min-width:120px;text-align:center;text-transform:capitalize}
  .theme-toggle{background:none;border:1px solid rgba(255,255,255,.15);color:#d8d0c0;border-radius:999px;width:34px;height:34px;cursor:pointer;font-size:15px}

  /* ===== tabs ===== */
  .tabs{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:8}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:12}
  .tabs-inner{max-width:1120px;margin:0 auto;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
  .tabs-inner::-webkit-scrollbar{display:none}
  .tab{background:none;border:none;font-size:15px;color:var(--ink-soft);padding:15px 18px;cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;font-weight:500}
  .tab:hover{color:var(--ink)}
  .tab.active{color:var(--ink);border-bottom-color:var(--gold);font-weight:600}

  /* ===== shell ===== */
  .wrap{max-width:1120px;margin:0 auto;padding-block:26px 70px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
  .view{display:none}
  .view.on{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.view.on{animation:none}}

  .sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  .sec-label{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
  .sec-head h2{font-size:27px;margin-top:3px}
  .sub{color:var(--ink-soft);font-size:14px;max-width:580px;margin:6px 0 0}
  .block-label{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;margin:0 0 14px}

  .btn{background:var(--dark);color:#f6f3ec;border:none;font-weight:600;font-size:14px;padding:11px 18px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
  .btn:hover{opacity:.92}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .btn.ghost:hover{background:var(--surface-2)}
  .btn.sm{padding:7px 13px;font-size:13px}

  .seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px}
  .seg button{background:none;border:none;font-size:14px;color:var(--ink-soft);padding:8px 17px;border-radius:999px;cursor:pointer;font-weight:500}
  .seg button.on{background:var(--dark);color:#f6f3ec;font-weight:600}

  /* cards & tables */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
  table.fin{width:100%;border-collapse:collapse;font-size:14px;min-width:460px}
  table.fin th{text-align:right;padding:13px 16px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;border-bottom:1px solid var(--line);background:rgba(0,0,0,.015)}
  table.fin th:first-child{text-align:left}
  table.fin td{padding:12px 16px;border-bottom:1px solid var(--line-soft);text-align:right}
  table.fin td:first-child{text-align:left;font-weight:600}
  table.fin tbody tr:last-child td{border-bottom:none}
  table.fin tbody tr:hover{background:var(--surface-2)}
  table.fin tr.dim td{color:var(--ink-faint);font-weight:400}
  table.fin tfoot td{padding:13px 16px;font-weight:700;border-top:2px solid var(--line);background:rgba(0,0,0,.02)}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) table.fin th,:root:not([data-theme="light"]) table.fin tfoot td{background:rgba(255,255,255,.03)}}
  :root[data-theme="dark"] table.fin th,:root[data-theme="dark"] table.fin tfoot td{background:rgba(255,255,255,.03)}

  .bar-cell{display:inline-block;width:46px;height:5px;border-radius:3px;background:var(--line);overflow:hidden;vertical-align:middle;margin-left:8px}
  .bar-cell i{display:block;height:100%;border-radius:3px}

  .tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px}
  .tag .d{width:6px;height:6px;border-radius:50%;flex-shrink:0}
  .tag.nico{background:var(--nico-soft);color:var(--nico-ink)} .tag.nico .d{background:var(--nico)}
  .tag.mari{background:var(--mari-soft);color:var(--mari-ink)} .tag.mari .d{background:var(--mari)}
  .tag.ambos{background:var(--ambos-soft);color:var(--ambos-ink)} .tag.ambos .d{background:var(--ambos)}
  .tag.cat{background:rgba(0,0,0,.045);color:var(--ink-soft);font-weight:500}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.cat{background:rgba(255,255,255,.07)}}
  :root[data-theme="dark"] .tag.cat{background:rgba(255,255,255,.07)}

  .pay-check{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;color:#fff;transition:all .15s}
  .pay-check.done{background:var(--nico);border-color:var(--nico)}
  .pay-check.pending-reimburse{border-color:var(--amber);border-style:dashed}

  .empty{text-align:center;padding:40px 20px;color:var(--ink-faint)}
  .empty .ico{font-size:30px;margin-bottom:8px}

  .foot-note{text-align:center;color:var(--ink-faint);font-size:12.5px;margin-top:44px;line-height:1.7}
  .foot-note a{color:var(--ink-soft)}

  /* ===== RESUMEN specific ===== */
  .hero-strip{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:16px;margin-bottom:16px}
  @media (max-width:760px){.hero-strip{grid-template-columns:1fr;gap:12px}}
  .hero-main{background:var(--dark);color:#f3efe7;border-radius:var(--radius);padding:24px 26px;box-shadow:var(--shadow-lg);position:relative;overflow:hidden}
  .hero-main .k{font-size:13px;color:#b0a893;margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .hero-main .v{font-family:var(--sans);font-weight:700;font-size:46px;line-height:.95;color:#fff;letter-spacing:-.02em}
  .hero-main .foot{font-size:12.5px;color:#8c8578;margin-top:10px}
  .hero-main .spark{position:absolute;right:0;bottom:0;opacity:.5}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
  .stat .k{font-size:12.5px;color:var(--ink-soft);margin-bottom:7px}
  .stat .v{font-family:var(--sans);font-weight:700;font-size:28px;line-height:1;letter-spacing:-.01em}
  .stat .v.sm{font-size:23px}
  .stat .foot{font-size:12px;color:var(--ink-faint);margin-top:7px}

  .res-cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;margin-top:24px}
  @media (max-width:860px){.res-cols{grid-template-columns:1fr}}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .panel-h{display:flex;justify-content:space-between;align-items:center;padding:17px 22px 0}
  .panel-h h3{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint)}
  .panel-h .hint{font-size:12px;color:var(--ink-faint)}
  .rows{padding:10px 22px 18px}
  .row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-soft);gap:12px}
  .row:last-child{border-bottom:none}
  .row .lab{color:var(--ink-soft);font-size:14px;display:flex;align-items:center;gap:8px;min-width:0}
  .row .lab .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .val{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
  .row.total{border-top:2px solid var(--line);margin-top:4px;padding-top:12px}
  .row.total .lab,.row.total .val{font-weight:700;color:var(--ink);font-size:15px}

  /* donut + legend */
  .donut-wrap{display:flex;gap:24px;align-items:center;padding:18px 22px 22px;flex-wrap:wrap}
  .donut{flex-shrink:0}
  .legend{flex:1;min-width:190px;display:flex;flex-direction:column;gap:1px}
  .leg{display:grid;grid-template-columns:12px 1fr auto auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px}
  .leg:last-child{border-bottom:none}
  .leg .ld{width:11px;height:11px;border-radius:3px}
  .leg .ln{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .leg .lv{font-weight:600;font-variant-numeric:tabular-nums}
  .leg .lp{color:var(--ink-faint);font-size:12px;min-width:34px;text-align:right}

  /* goal bars */
  .goal{padding:4px 0 2px}
  .goal-top{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;margin-bottom:6px}
  .goal-top .gn{color:var(--ink-soft)}
  .goal-top .gv{font-weight:600;font-variant-numeric:tabular-nums}
  .goal-bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden}
  .goal-bar i{display:block;height:100%;border-radius:5px;background:var(--nico)}
  .goal-sub{font-size:12px;color:var(--ink-faint);margin-top:5px}

  /* compras list */
  .buy-list{display:flex;flex-direction:column;gap:9px}
  .buy{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px 15px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:var(--shadow)}
  .buy-main{min-width:0;flex:1}
  .buy-title{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .buy-meta{display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap;color:var(--ink-faint);font-size:12.5px}
  .buy-amt{font-weight:700;font-size:16px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .buy-del{background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:17px;padding:2px 4px;line-height:1}
  .buy-del:hover{color:var(--warn)}
  .card-chip{display:inline-flex;align-items:center;gap:4px}

  .ptables{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media (max-width:860px){.ptables{grid-template-columns:1fr}}
  .ptables.one{grid-template-columns:1fr;max-width:580px}
  .pt-head{margin-bottom:10px}

  /* filter bar */
  .filter-bar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
  .filter-bar input,.filter-bar select{padding:8px 11px;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:13.5px;background:var(--surface);color:var(--ink)}
  .filter-bar input:focus,.filter-bar select:focus{outline:none;border-color:var(--gold)}

  /* config */
  .cfg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:20px;align-items:start}
  .cfg-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
  .cfg-card h3{font-size:17px;margin-bottom:3px}
  .cfg-card .desc{font-size:13px;color:var(--ink-soft);margin:0 0 14px}
  .fieldrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
  .fieldrow:last-of-type{border-bottom:none}
  .fieldrow .fl{font-size:14px;color:var(--ink-soft);display:flex;align-items:center;gap:8px;min-width:0}
  .fieldrow .fl .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fieldrow input{font-size:14px;font-weight:600;text-align:right;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 11px;width:130px;font-variant-numeric:tabular-nums}
  .fieldrow input.txt{text-align:left;width:150px;font-weight:500}
  .fieldrow input:focus{outline:none;border-color:var(--gold)}
  .fieldrow .del{background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:16px;padding:0 2px}
  .fieldrow .del:hover{color:var(--warn)}

  /* modal */
  .scrim{position:fixed;inset:0;background:rgba(20,16,8,.55);display:none;align-items:flex-end;justify-content:center;z-index:50;padding:0}
  .scrim.on{display:flex}
  @media (min-width:600px){.scrim{align-items:center;padding:20px}}
  .modal{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:460px;box-shadow:var(--shadow-lg);max-height:92vh;overflow-y:auto;padding:4px 0 max(22px,env(safe-area-inset-bottom,0px))}
  @media (min-width:600px){.modal{border-radius:20px}}
  .modal-h{display:flex;justify-content:space-between;align-items:center;padding:20px 22px 12px}
  .modal-h h3{font-size:20px}
  .modal-h .x{background:none;border:none;font-size:24px;color:var(--ink-faint);cursor:pointer;line-height:1}
  .modal form{padding:0 22px}
  .fld{margin-bottom:14px}
  .fld label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:6px}
  .fld input,.fld select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:16px;background:var(--bg);color:var(--ink)}
  .fld input:focus,.fld select:focus{outline:none;border-color:var(--gold)}
  .fld-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .choice{display:flex;gap:8px}
  .choice label{flex:1;position:relative;cursor:pointer}
  .choice input{position:absolute;opacity:0}
  .choice span{display:block;text-align:center;padding:11px 8px;border:1.5px solid var(--line);border-radius:var(--radius-sm);font-size:14px;font-weight:600;color:var(--ink-soft)}
  .choice input:checked+span{border-color:var(--gold);background:var(--gold-soft);color:var(--ink)}
  .hint{font-size:12.5px;color:var(--ink-faint);margin:2px 0 0}
  .modal .btn{width:100%;justify-content:center;margin-top:6px;padding:13px}

  .save-badge{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--dark);color:#f3efe7;padding:9px 18px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);opacity:0;transition:all .3s;z-index:40;pointer-events:none}
  .save-badge.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- ===== LOCK ===== -->
<div id="lock">
  <div class="lock-card">
    <div class="eyebrow">Finanzas del hogar</div>
    <h1>Cuentas <span>de casa</span></h1>

function norm(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
/* deduce [categoría, subcategoría] de una descripción; null si no encuentra */
function autoCat(desc){
  const d=norm(desc);
  for(const entry of CAT_DICT){
    const keys=entry[0], cs=entry[1], exact=entry[2];
    for(const k of keys){
      const kn=norm(k);
      if(exact){
        if(new RegExp('\\b'+kn.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b').test(d)) return {cat:cs[0],sub:cs[1]};
      } else if(d.includes(kn)) return {cat:cs[0],sub:cs[1]};
    }
  }
  return null;
}

/* ---- helpers de mes ---- */
function ymKey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function monthName(key){
  const [y,m]=key.split("-").map(Number);
  const d=new Date(y,m-1,1);

}
function shiftMonth(key,delta){
  const [y,m]=key.split("-").map(Number);
  const d=new Date(y,m-1+delta,1);
  return ymKey(d);
}
/* devuelve (y crea si falta) el objeto del mes */
function M(key){
  key=key||curMonthKey;
  if(!db.months[key]) db.months[key]={buys:[],pays:[],reimbursed:{},moves:{a:[],b:[]},resumenExtra:{},settle:[],transfers:[]};
  const mo=db.months[key];

  if(!mo.moves)mo.moves={a:[],b:[]}; if(!mo.moves.a)mo.moves.a=[]; if(!mo.moves.b)mo.moves.b=[];
  if(!mo.resumenExtra)mo.resumenExtra={}; if(!mo.settle)mo.settle=[]; if(!mo.transfers)mo.transfers=[];
  return mo;
}
/* Mes de la app al que pertenece una compra, según el corte de su tarjeta.
   La compra entra al corte que aún no ha pasado (primer día de corte >= fecha),
   y ese corte se paga con los ingresos del mes ANTERIOR al corte. Ese mes anterior
   es el "mes" de la app. Si la tarjeta no tiene corte definido, usa el mes de la compra. */
function payMonthOf(dateISO, cardId){
  const cut=db.config.cardCuts&&db.config.cardCuts[cardId];
  if(!dateISO) return curMonthKey;
  if(!cut || cut<1) return (dateISO).slice(0,7); // sin corte: mes calendario de la compra
  const d=new Date(dateISO+'T00:00:00');
  let corte=new Date(d.getFullYear(), d.getMonth(), cut);
  if(d > corte) corte=new Date(d.getFullYear(), d.getMonth()+1, cut); // pasó el corte de este mes
  const pay=new Date(corte.getFullYear(), corte.getMonth()-1, 1);     // se paga con ingreso del mes anterior al corte
  return pay.getFullYear()+'-'+String(pay.getMonth()+1).padStart(2,'0');
}

}

function pct(){
  const sa=db.config.people.a.salary||0, sb_=db.config.people.b.salary||0;

  if(t<=0) return {a:0.5,b:0.5};

}

   ============================================================ */
/* Todas las compras (de cualquier mes guardado) cuyo mes de pago cae en `key`.
   Así una compra del 20-oct con corte el 8 aparece en Octubre aunque se guardara después. */
function buysForMonth(key){
  key=key||curMonthKey;
  const out=[];
  Object.values(db.months).forEach(mo=>{
    (mo.buys||[]).forEach(b=>{ if(payMonthOf(b.date,b.card)===key) out.push(b); });
  });
  return out;
}
/* Usado de una tarjeta en el mes de pago `key` */
function cardUsed(cardId,key){
  return buysForMonth(key).filter(b=>b.card===cardId).reduce((s,b)=>s+b.amt,0);
}
/* Lo que le corresponde a una persona en una tarjeta: propio + su parte de ambos */
function cardPersonParts(cardId,who,key){
  const p=pct();
  let propio=0, ambos=0;
  buysForMonth(key).forEach(b=>{
    if(b.card!==cardId) return;
    if(b.who===who) propio+=b.amt;
    else if(b.who==="shared") ambos += b.amt*(who==="a"?p.a:p.b);
  });
  return {propio, ambos, total:propio+ambos};
}

/* ---- cuentas bancarias ---- */
function accById(id){ return (db.config.accounts||[]).find(a=>a.id===id); }
function accCur(id){ const a=accById(id); return a&&a.cur==='USD'?'USD':'COP'; }
/* saldo de una cuenta: inicial + ingresos − gastos (movimientos ligados) + transfers recibidas − enviadas.
   Suma TODOS los meses (el saldo es acumulado, no por mes). */
function accountBalance(accId){
  const a=accById(accId); if(!a) return 0;
  let bal=a.bal0||0;
  Object.values(db.months).forEach(mo=>{
    // movimientos de ambas personas ligados a esta cuenta
    ['a','b'].forEach(who=>{
      (mo.moves&&mo.moves[who]||[]).forEach(m=>{
        if(m.acc===accId){ bal += (m.dir>0 ? m.amt : -m.amt); }
      });
    });
    // transferencias
    (mo.transfers||[]).forEach(t=>{
      if(t.to===accId)   bal += (t.amtDest!==undefined ? t.amtDest : t.amt);
      if(t.from===accId) bal -= t.amt;
    });
  });
  return bal;
}

  try{
    const {error}=await sb.from('estado').upsert({id:ROW_ID,data:db,updated_at:new Date().toISOString()});

  saving=false;

async function startSync(){
  if(!sbReady){ setSync('off','Modo local'); return; }
  setSync('wait','Conectando…');
  try{
    const {data,error}=await sb.from('estado').select('data').eq('id',ROW_ID).maybeSingle();
    if(error) throw error;
    if(data && data.data && (data.data.config||data.data.people)){
      applyRemote(data.data);
    } else if(dbHasData(db)){
      await pushToCloud();
    }
    setSync('','En línea');
  }catch(e){ console.error('[Cuentas] Error al conectar:',e); setSync('off','Sin conexión'); return; }
  sb.channel('estado-live').on('postgres_changes',
    {event:'*',schema:'public',table:'estado',filter:'id=eq.'+ROW_ID},
    payload=>{ const nd=payload.new&&payload.new.data; if(nd&&(nd.config||nd.months)) applyRemote(nd); })
    .subscribe();
}

}

    sessionStorage.setItem('cc_unlock','1');
    document.getElementById('lock').style.display='none';
    boot();
  } else {
    document.getElementById('lockInput').value='';
    document.getElementById('lockInput').placeholder='Clave incorrecta';
  }
}
document.getElementById('lockBtn').onclick=unlock;
document.getElementById('lockInput').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
if(sessionStorage.getItem('cc_unlock')==='1'){ document.getElementById('lock').style.display='none'; boot(); }
else document.getElementById('lockInput').focus();

/* tema */
let forcedTheme=null;
document.getElementById('themeBtn').onclick=()=>{
  forcedTheme = forcedTheme==='dark'?'light':(forcedTheme==='light'?null:'dark');
  if(forcedTheme) document.documentElement.setAttribute('data-theme',forcedTheme);
  else document.documentElement.removeAttribute('data-theme');
};
/* navegación mes */
document.getElementById('prevMonth').onclick=()=>{ curMonthKey=shiftMonth(curMonthKey,-1); renderAll(); };
document.getElementById('nextMonth').onclick=()=>{ curMonthKey=shiftMonth(curMonthKey,1); renderAll(); };
/* navegación pestañas */
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  curView=t.dataset.view;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
  document.getElementById('v-'+curView).classList.add('on');
  renderCurrent();
  window.scrollTo({top:0,behavior:'smooth'});
}));

/* render global */
function renderAll(){
  document.getElementById('monthLabel').textContent=monthName(curMonthKey);
  renderCurrent();
}
function renderCurrent(){
  try{
    if(curView==="resumen") renderResumen();
    else if(curView==="compras") renderCompras();
    else if(curView==="cuentas") renderCuentas();
    else if(curView==="entre") renderEntre();
    else if(curView==="config") renderConfig();
  }catch(e){
    console.error('[Cuentas] Error al dibujar',curView,e);
    const el=document.getElementById('v-'+curView);
    if(el) el.innerHTML='<div class="card"><div class="empty"><div class="ico">⚠️</div><p>Hubo un problema al mostrar esta sección. Recarga la página.</p></div></div>';
  }
}

/* respaldo */
document.getElementById('backupBtn').onclick=(e)=>{
  e.preventDefault();
  const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url;
  a.download='cuentas-de-casa-'+ymKey(new Date())+'.json'; a.click();
  URL.revokeObjectURL(url);
};
document.getElementById('restoreBtn').onclick=(e)=>{e.preventDefault();document.getElementById('restoreFile').click();};
document.getElementById('restoreFile').onchange=(e)=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); db=migrateIfNeeded(d); normalizeDB(); renderAll(); save(); alert('Datos restaurados.'); }catch(err){ alert('Archivo no válido.'); } };
  r.readAsText(f);
};

/* modal helpers */
function openModal(html){
  const s=document.getElementById('scrim');
  s.innerHTML='<div class="modal">'+html+'</div>';
  s.classList.add('on');
  s.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);
  s.onclick=(e)=>{ if(e.target===s) closeModal(); };
}
function closeModal(){ const s=document.getElementById('scrim'); s.classList.remove('on'); s.innerHTML=''; }
</script>
<script>
/* ============================================================
   RESUMEN
   ============================================================ */
const CAT_COLORS=['#167a5f','#b5801f','#8c3fa8','#c0603a','#3b7d9a','#7a6a3a','#a85a7a','#5b8f6b','#9a6b3f','#6b6b8f','#8f7a4a'];

function renderResumen(){
  const el=document.getElementById('v-resumen');
  const p=pct();
  const ex=M().resumenExtra;
  // ingresos: salario fijo + override del mes si existe
  const incA = ex.incomeA!=null?ex.incomeA:(db.config.people.a.salary||0);
  const incB = ex.incomeB!=null?ex.incomeB:(db.config.people.b.salary||0);
  const income=incA+incB;

  // gastos del mes = gastos fijos + compras del mes (todas las tarjetas)
  const fixedTotal=db.config.fixedExpenses.reduce((s,f)=>s+f.amt,0);
  const monthBuys=buysForMonth(curMonthKey);
  const buysTotal=monthBuys.reduce((s,b)=>s+b.amt,0);
  const gastos=fixedTotal+buysTotal;

  // ahorros: metas y lo real del mes
  const goals=db.config.savingGoals;
  const goalTotal=goals.reduce((s,g)=>s+g.amt,0);
  const savedReal=goals.reduce((s,g)=>s+((ex.savings&&ex.savings[g.id])||0),0);

  const saldo=income-gastos-savedReal;

  // categorías para la dona (de compras + fijos)
  const catMap={};
  monthBuys.forEach(b=>{ const c=b.cat||"Otros"; catMap[c]=(catMap[c]||0)+b.amt; });
  db.config.fixedExpenses.forEach(f=>{ catMap[f.cat||"Vivienda"]=(catMap[f.cat||"Vivienda"]||0)+f.amt; });
  const catArr=Object.entries(catMap).sort((a,b)=>b[1]-a[1]);

  el.innerHTML=`
    <div class="sec-head">
      <div><div class="sec-label">${esc(monthName(curMonthKey))}</div><h2>Resumen del mes</h2></div>
    </div>

    <div class="hero-strip">
      <div class="hero-main">
        <div class="k">Lo que te queda este mes</div>
        <div class="v">${saldo<0?'−':''}${fmt(Math.abs(saldo)).slice(1)}</div>
        <div class="foot">Ingresos − tarjetas (por corte) − fijos − ahorros</div>
      </div>
      <div class="stat"><div class="k">Ingresos</div><div class="v sm num" style="color:var(--ok)">${fmt(income).slice(1)}</div><div class="foot">salarios del hogar</div></div>
      <div class="stat"><div class="k">Gastos</div><div class="v sm num">${fmt(gastos).slice(1)}</div><div class="foot">fijos + ${monthBuys.length} compras</div></div>
    </div>

    <div class="res-cols">
      <div style="display:flex;flex-direction:column;gap:20px">
        ${catArr.length?donutPanel(catArr):''}
        <div class="panel">
          <div class="panel-h"><h3>Ingresos del hogar</h3></div>
          <div class="rows">
            <div class="row"><span class="lab"><span class="tag nico"><span class="d"></span>${esc(whoName('a'))}</span></span><span class="val">${fmt(incA)}</span></div>
            <div class="row"><span class="lab"><span class="tag mari"><span class="d"></span>${esc(whoName('b'))}</span></span><span class="val">${fmt(incB)}</span></div>
            <div class="row total"><span class="lab">Total</span><span class="val">${fmt(income)}</span></div>
          </div>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:20px">
        <div class="panel">
          <div class="panel-h"><h3>Gastos</h3><span class="hint">fijos + compras</span></div>
          <div class="rows">
            ${db.config.fixedExpenses.map(f=>`<div class="row"><span class="lab"><span class="nm">${esc(f.name)}</span> <span class="tag cat">fijo</span></span><span class="val">${fmt(f.amt)}</span></div>`).join('')}
            ${buysTotal>0?`<div class="row"><span class="lab"><span class="nm">Compras con tarjeta</span></span><span class="val">${fmt(buysTotal)}</span></div>`:''}
            ${(!db.config.fixedExpenses.length&&!buysTotal)?'<div class="empty" style="padding:20px"><p>Sin gastos aún este mes.</p></div>':''}
            <div class="row total"><span class="lab">Total gastos</span><span class="val">${fmt(gastos)}</span></div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-h"><h3>Ahorros · meta del mes</h3></div>
          <div class="rows">
            ${goals.length?goals.map(g=>{
              const real=(ex.savings&&ex.savings[g.id])||0;
              const pc=g.amt>0?Math.min(100,real/g.amt*100):0;
              return `<div class="goal">
                <div class="goal-top"><span class="gn">${esc(g.name)}</span><span class="gv">${fmt(real)} / ${fmt(g.amt)}</span></div>
                <div class="goal-bar"><i style="width:${pc}%"></i></div>
                <div class="goal-sub">${Math.round(pc)}% de la meta${real<g.amt?` · faltan ${fmt(g.amt-real)}`:' · ¡completa! ✓'}</div>
              </div>`;
            }).join(''):'<div class="empty" style="padding:20px"><p>Configura tus metas de ahorro en Configuración.</p></div>'}
            ${goals.length?`<div class="row total"><span class="lab">Meta total</span><span class="val">${fmt(goalTotal)}</span></div>`:''}
          </div>
        </div>
      </div>
    </div>`;
}

/* dona SVG de categorías */
function donutPanel(catArr){
  const total=catArr.reduce((s,c)=>s+c[1],0);
  if(total<=0) return '';
  const R=58, r=36, cx=66, cy=66, C=2*Math.PI*((R+r)/2), SW=R-r;
  let acc=0, segs='';
  catArr.forEach((c,i)=>{
    const frac=c[1]/total;
    const len=frac*C;
    const col=CAT_COLORS[i%CAT_COLORS.length];
    const dash=`${Math.max(0,len-2)} ${C-Math.max(0,len-2)}`;
    const off=-acc*C;
    segs+=`<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="${col}" stroke-width="${SW}" stroke-dasharray="${dash}" stroke-dashoffset="${off}" transform="rotate(-90 ${cx} ${cy})"/>`;
    acc+=frac;
  });
  const legend=catArr.map((c,i)=>`
    <div class="leg">
      <span class="ld" style="background:${CAT_COLORS[i%CAT_COLORS.length]}"></span>
      <span class="ln">${esc(c[0])}</span>
      <span class="lv">${fmt(c[1])}</span>
      <span class="lp">${Math.round(c[1]/total*100)}%</span>
    </div>`).join('');
  return `<div class="panel">
    <div class="panel-h"><h3>En qué se va el dinero</h3></div>
    <div class="donut-wrap">
      <svg class="donut" width="132" height="132" viewBox="0 0 132 132" role="img" aria-label="Distribución de gastos por categoría">
        ${segs}
        <text x="66" y="62" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink)" font-family="var(--sans)">${fmt(total).length>9?fmt(total).slice(0,-4)+'k':fmt(total).slice(1)}</text>
        <text x="66" y="78" text-anchor="middle" font-size="9" fill="var(--ink-faint)" letter-spacing="1">TOTAL</text>
      </svg>
      <div class="legend">${legend}</div>
    </div>
  </div>`;
}

</script>
<script>
/* ============================================================
   COMPRAS DEL MES
   ============================================================ */
function renderCompras(){
  const el=document.getElementById('v-compras');
  const p=pct();
  const cards=db.config.cards;

  el.innerHTML=`
    <div class="sec-head">
      <div>
        <div class="sec-label">${esc(monthName(curMonthKey))}</div>
        <h2>Compras del mes</h2>
        <p class="sub">Anota cada compra con su tarjeta y quién la hizo. Las tablas de abajo te dicen solas cuánto debe cada uno.</p>
      </div>
      <button class="btn" onclick="openBuyModal()">+ Agregar compra</button>
    </div>

    ${cards.length?`
    <div class="table-wrap" style="margin-bottom:28px">
      <table class="fin">
        <thead><tr><th>Tarjeta</th><th>Cupo</th><th>Usado</th><th>Saldo</th><th>% Uso</th></tr></thead>
        <tbody>${cardUseRows()}</tbody>
        <tfoot>${cardUseFoot()}</tfoot>
      </table>
    </div>

    <div class="block-label">Lo que debe cada uno por tarjeta</div>
    <div class="ptables" style="margin-bottom:30px">
      ${personCardTable('a')}
      ${personCardTable('b')}
    </div>
    `:'<div class="card"><div class="empty"><div class="ico">💳</div><p>Aún no hay tarjetas. Agrégalas en Configuración.</p></div></div>'}

    <div class="block-label">Compras de ${esc(monthName(curMonthKey))} · ${buysForMonth(curMonthKey).length} ${buysForMonth(curMonthKey).length===1?'registro':'registros'}</div>
    <div class="buy-list">${buyRows()}</div>`;
}

function cardUseRows(){
  const limits=db.config.cardLimits;
  return db.config.cards.map(c=>{
    const used=cardUsed(c.id);
    const lim=limits[c.id]||0;
    const saldo=lim-used;
    const pc=lim>0?used/lim*100:0;
    const col=pc>=100?'var(--warn)':pc>=70?'var(--amber)':'var(--ok)';
    const dim=used<=0?' class="dim"':'';
    return `<tr${dim}>
      <td>${esc(c.name)}</td>
      <td class="num">${lim>0?fmt(lim):'—'}</td>
      <td class="num">${fmt(used)}</td>
      <td class="num"${saldo<0?' style="color:var(--warn)"':''}>${lim>0?fmt(saldo):'—'}</td>
      <td class="num" style="color:${col}">${lim>0?pc.toFixed(1)+'%':'—'} ${lim>0?`<span class="bar-cell"><i style="width:${Math.min(100,pc)}%;background:${col}"></i></span>`:''}</td>
    </tr>`;
  }).join('');
}
function cardUseFoot(){
  const limits=db.config.cardLimits;
  let tLim=0,tUsed=0;
  db.config.cards.forEach(c=>{ tLim+=limits[c.id]||0; tUsed+=cardUsed(c.id); });
  const pc=tLim>0?tUsed/tLim*100:0;
  return `<tr><td>Total</td><td class="num">${fmt(tLim)}</td><td class="num">${fmt(tUsed)}</td><td class="num">${fmt(tLim-tUsed)}</td><td class="num">${pc.toFixed(1)}%</td></tr>`;
}

function personCardTable(who){
  const rows=db.config.cards.map(c=>{
    const parts=cardPersonParts(c.id,who);
    const paid=findPay(c.id,who);
    if(parts.total<=0.5){
      return `<tr class="dim"><td>${esc(c.name)}</td><td class="num">—</td><td class="num">—</td><td class="num">—</td><td></td></tr>`;
    }
    let chk;
    if(paid){
      chk=`<span class="pay-check done" title="Pagado${paid.reimbursedOther?' · pagó ambas partes':''}" onclick="togglePay('${c.id}','${who}')">✓</span>`;
    } else {
      chk=`<span class="pay-check" title="Marcar pagado" onclick="openPayModal('${c.id}','${who}')"></span>`;
    }
    return `<tr>
      <td>${esc(c.name)}</td>
      <td class="num">${parts.propio>0?fmt(parts.propio):'$0'}</td>
      <td class="num">${parts.ambos>0?fmt(parts.ambos):'$0'}</td>
      <td class="num" style="font-weight:600">${fmt(parts.total)}</td>
      <td>${chk}</td>
    </tr>`;
  }).join('');
  let tP=0,tA=0;
  db.config.cards.forEach(c=>{ const pr=cardPersonParts(c.id,who); tP+=pr.propio; tA+=pr.ambos; });
  return `<div>
    <div class="pt-head"><span class="tag ${whoClass(who)}"><span class="d"></span>${esc(whoName(who))} · ${Math.round((who==='a'?pct().a:pct().b)*100)}%</span></div>
    <div class="table-wrap"><table class="fin" style="min-width:380px">
      <thead><tr><th>Tarjeta</th><th>Propio</th><th>Ambos</th><th>Total</th><th>Pago</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td>Total</td><td class="num">${fmt(tP)}</td><td class="num">${fmt(tA)}</td><td class="num">${fmt(tP+tA)}</td><td></td></tr></tfoot>
    </table></div>
  </div>`;
}

function buyRows(){
  const buys=buysForMonth(curMonthKey).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  if(!buys.length) return '<div class="card"><div class="empty"><div class="ico">🧾</div><p>Sin compras este mes. Pulsa «Agregar compra».</p></div></div>';
  const cardName=id=>{ const c=db.config.cards.find(x=>x.id===id); return c?c.name:'—'; };
  return buys.map(b=>`
    <div class="buy">
      <div class="buy-main">
        <div class="buy-title">${esc(b.desc||'(sin nombre)')}</div>
        <div class="buy-meta">
          <span class="tag ${whoClass(b.who)}"><span class="d"></span>${esc(whoName(b.who))}</span>
          <span class="card-chip">💳 ${esc(cardName(b.card))}</span>
          ${b.cat?`<span class="tag cat">${esc(b.cat)}${b.sub&&b.sub!==b.cat?' › '+esc(b.sub):''}</span>`:''}
          ${b.date?`<span>${b.date.slice(8,10)}/${b.date.slice(5,7)}</span>`:''}
        </div>
      </div>
      <div class="buy-amt">${fmt(b.amt)}</div>
      <button class="buy-del" title="Borrar" onclick="delBuy('${b.id}')">×</button>
    </div>`).join('');
}
</script>
<script>
/* ============================================================
   CUENTAS (movimientos propios por persona)
   ============================================================ */
function renderCuentas(){
  const el=document.getElementById('v-cuentas');
  const who=cuentasPerson;
  const moves=M().moves[who].slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  let inc=0,out=0,saveUSD=0,saveCOP=0;
  moves.forEach(m=>{
    if(m.dir>0) inc+=m.amt; else out+=m.amt;
    if(m.cat==='Ahorro'){ if(m.cur==='USD') saveUSD+=m.amtUSD||0; else saveCOP+=m.amt; }
  });
  const saldo=inc-out;

  el.innerHTML=`
    <div class="sec-head">
      <div>
        <div class="sec-label">${esc(monthName(curMonthKey))}</div>
        <h2>Cuentas</h2>
        <p class="sub">El control de los movimientos propios de cada uno: lo que entra y lo que sale, día a día.</p>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn ghost" onclick="openTransferModal()">⇄ Transferir</button>
        <button class="btn" onclick="openMoveModal()">+ Agregar movimiento</button>
      </div>
    </div>

    <div class="seg" style="margin-bottom:22px">
      <button class="${who==='a'?'on':''}" onclick="setCuentasPerson('a')">${esc(whoName('a'))}</button>
      <button class="${who==='b'?'on':''}" onclick="setCuentasPerson('b')">${esc(whoName('b'))}</button>
    </div>

    ${accountsStrip(who)}

    <div class="hero-strip" style="grid-template-columns:repeat(3,1fr);margin-bottom:28px">
      <div class="stat"><div class="k">Ingresos del mes</div><div class="v sm num" style="color:var(--ok)">${fmt(inc).slice(1)}</div><div class="foot">solo este mes</div></div>
      <div class="stat"><div class="k">Gastos del mes</div><div class="v sm num">${fmt(out).slice(1)}</div><div class="foot">solo este mes</div></div>
      <div class="stat"><div class="k">Balance del mes</div><div class="v sm num" style="color:${saldo<0?'var(--warn)':'var(--ok)'}">${saldo<0?'−':'+'}${fmt(Math.abs(saldo)).slice(1)}</div><div class="foot">ingresos − gastos</div></div>
    </div>

    <div class="block-label">Movimientos de ${esc(monthName(curMonthKey))}</div>
    ${moves.length?`<div class="table-wrap"><table class="fin">
      <thead><tr><th>Fecha</th><th>Descripción</th><th>Categoría</th><th>Banco</th><th>Entra</th><th>Sale</th><th></th></tr></thead>
      <tbody>${moves.map(m=>moveRow(m,who)).join('')}</tbody>
    </table></div>`:'<div class="card"><div class="empty"><div class="ico">📒</div><p>Sin movimientos este mes. Pulsa «Agregar movimiento».</p></div></div>'}`;
}
/* tarjetas de saldo de las cuentas de una persona (COP y USD separados) */
function accountsStrip(who){
  const accs=(db.config.accounts||[]).filter(a=>a.who===who||a.who==='shared');
  if(!accs.length) return '<div class="card" style="margin-bottom:22px;padding:16px 20px;color:var(--ink-soft);font-size:13.5px">Aún no tienes cuentas. Agrégalas en Configuración para ver tus saldos aquí.</div>';
  const totalCOP=accs.filter(a=>(a.cur||'COP')==='COP').reduce((s,a)=>s+accountBalance(a.id),0);
  const totalUSD=accs.filter(a=>a.cur==='USD').reduce((s,a)=>s+accountBalance(a.id),0);
  const hayUSD=accs.some(a=>a.cur==='USD');
  const cards=accs.map(a=>{
    const bal=accountBalance(a.id);
    const cur=a.cur||'COP';
    const isShared=a.who==='shared';
    return `<div class="stat" style="${cur==='USD'?'background:var(--nico-soft);border-color:var(--nico)':''}">
      <div class="k" style="${cur==='USD'?'color:var(--nico-ink)':''}">${esc(a.name)}${isShared?' <span class="tag cat" style="font-size:10px">compartida</span>':''}</div>
      <div class="v sm num" style="${cur==='USD'?'color:var(--nico-ink)':(bal<0?'color:var(--warn)':'')}">${cur==='USD'?fmtUSD(bal):fmt(bal).slice(1)}</div>
      <div class="foot" style="${cur==='USD'?'color:var(--nico-ink);opacity:.7':''}">${cur==='USD'?'en dólares':'saldo actual'}</div>
    </div>`;
  }).join('');
  return `<div class="hero-strip" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:16px">
    <div class="stat" style="background:var(--dark);border-color:var(--dark)">
      <div class="k" style="color:#b0a893">Saldo total (pesos)</div>
      <div class="v sm num" style="color:#fff">${fmt(totalCOP).slice(1)}</div>
      <div class="foot" style="color:#8c8578">${hayUSD?'+ '+fmtUSD(totalUSD)+' en dólares':'tus cuentas en COP'}</div>
    </div>
    ${cards}
  </div>`;
}
function moveRow(m,who){
  const auto = m.auto ? ' <span class="tag cat">auto</span>' : '';
  const del = m.auto ? '' : `<button class="buy-del" onclick="delMove('${who}','${m.id}')" title="Borrar">×</button>`;
  return `<tr>
    <td style="font-weight:400;white-space:nowrap">${m.date?m.date.slice(8,10)+'/'+m.date.slice(5,7):'—'}</td>
    <td style="text-align:left;font-weight:600">${esc(m.desc)}${auto}</td>
    <td style="text-align:left">${m.cat?`<span class="tag cat">${esc(m.cat)}</span>`:''}</td>
    <td style="text-align:left">${esc(m.bank||'')}</td>
    <td class="num" style="color:var(--ok)">${m.dir>0?fmt(m.amt):'—'}</td>
    <td class="num" style="color:var(--warn)">${m.dir<0?fmt(m.amt):'—'}</td>
    <td>${del}</td>
  </tr>`;
}
function setCuentasPerson(w){ cuentasPerson=w; renderCuentas(); }
</script>
<script>
/* ============================================================
   CONFIGURACIÓN
   ============================================================ */
function renderConfig(){
  const el=document.getElementById('v-config');
  const p=pct();

/* ---- parseo de números (formato colombiano: puntos de miles) ---- */
function parseNum(v){ if(v==null)return 0; return Math.round(parseFloat(String(v).replace(/[^\d,-]/g,'').replace(/\./g,'').replace(',','.'))||0); }

/* ---- acciones config ---- */
function setCardLimit(id,v){ db.config.cardLimits[id]=parseNum(v); save(); renderConfig(); }
function setCardCut(id,v){ const n=parseInt(String(v).replace(/\D/g,''))||0; db.config.cardCuts[id]=Math.min(31,Math.max(0,n)); save(); }
function delCard(id){ if(!confirm('¿Borrar esta tarjeta?'))return; db.config.cards=db.config.cards.filter(c=>c.id!==id); delete db.config.cardLimits[id]; delete db.config.cardCuts[id]; save(); renderConfig(); }
function addCard(){ const n=prompt('Nombre de la tarjeta:'); if(!n)return; db.config.cards.push({id:uid(),name:n.trim()}); save(); renderConfig(); }
function setSalary(w,v){ db.config.people[w].salary=parseNum(v); save(); renderConfig(); }
function setName(w,v){ db.config.people[w].name=v.trim()||(w==='a'?'Nico':'Mari'); save(); renderAll(); }
function addFixed(){ const n=prompt('Nombre del gasto fijo:'); if(!n)return; db.config.fixedExpenses.push({id:uid(),name:n.trim(),amt:0,cat:'Hogar',who:'shared',pay:'',cut:''}); save(); renderConfig(); }
function setFixedWho(id,v){ const f=db.config.fixedExpenses.find(x=>x.id===id); if(f){f.who=v;save();renderConfig();} }
function setFixedPay(id,v){ const f=db.config.fixedExpenses.find(x=>x.id===id); if(f){f.pay=v;save();} }
function setFixedCut(id,v){ const f=db.config.fixedExpenses.find(x=>x.id===id); if(f){f.cut=v;save();} }
function setFixedName(id,v){ const f=db.config.fixedExpenses.find(x=>x.id===id); if(f){f.name=v.trim();save();} }
function setFixedAmt(id,v){ const f=db.config.fixedExpenses.find(x=>x.id===id); if(f){f.amt=parseNum(v);save();renderConfig();} }
function delFixed(id){ db.config.fixedExpenses=db.config.fixedExpenses.filter(f=>f.id!==id); save(); renderConfig(); }
function addGoal(){ const n=prompt('Nombre de la meta de ahorro:'); if(!n)return; db.config.savingGoals.push({id:uid(),name:n.trim(),amt:0}); save(); renderConfig(); }
function setGoalName(id,v){ const g=db.config.savingGoals.find(x=>x.id===id); if(g){g.name=v.trim();save();} }
function setGoalAmt(id,v){ const g=db.config.savingGoals.find(x=>x.id===id); if(g){g.amt=parseNum(v);save();renderConfig();} }
function delGoal(id){ db.config.savingGoals=db.config.savingGoals.filter(g=>g.id!==id); save(); renderConfig(); }
/* ---- cuentas bancarias (config) ---- */
function addAccount(){ const n=prompt('Nombre de la cuenta/banco (ej: Bancolombia):'); if(!n)return; db.config.accounts.push({id:uid(),name:n.trim(),who:'a',cur:'COP',bal0:0}); save(); renderConfig(); }
function setAccName(id,v){ const a=accById(id); if(a){a.name=v.trim();save();} }
function setAccWho(id,v){ const a=accById(id); if(a){a.who=v;save();renderConfig();} }
function setAccCur(id,v){ const a=accById(id); if(a){a.cur=v;save();renderConfig();} }
function setAccBal0(id,v){ const a=accById(id); if(a){a.bal0=parseNum(v);save();renderConfig();} }
function delAccount(id){ if(!confirm('¿Borrar esta cuenta?'))return; db.config.accounts=db.config.accounts.filter(a=>a.id!==id); save(); renderConfig(); }
</script>
<script>
/* ============================================================
   MODALES (compra, pago, movimiento)
   ============================================================ */
const today=()=>new Date().toISOString().slice(0,10);

/* ---- compra ---- */
function openBuyModal(){
  if(!db.config.cards.length){ alert('Primero agrega una tarjeta en Configuración.'); return; }
  const cards=db.config.cards.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
  openModal(`
    <div class="modal-h"><h3>Agregar compra</h3><button class="x" data-close>×</button></div>
    <form onsubmit="saveBuy(event)">
      <div class="fld"><label>¿Qué compraste?</label><input id="bDesc" required placeholder="Ej: Mercado D1" oninput="updateAutoCat('b')" autocomplete="off"></div>
      <div class="fld-row">
        <div class="fld"><label>Tarjeta</label><select id="bCard">${cards}</select></div>
        <div class="fld"><label>Valor</label><input id="bAmt" inputmode="numeric" required placeholder="0"></div>
      </div>
      <div class="fld"><label>¿De quién es?</label>
        <div class="choice">
          <label><input type="radio" name="bwho" value="shared" checked><span>Ambos</span></label>
          <label><input type="radio" name="bwho" value="a"><span>${esc(whoName('a'))}</span></label>
          <label><input type="radio" name="bwho" value="b"><span>${esc(whoName('b'))}</span></label>
        </div>
      </div>
      <div id="bCatBox">${catPickerHtml('b','','')}</div>
      <div class="fld"><label>Fecha</label><input type="date" id="bDate" value="${today()}"></div>
      <button type="submit" class="btn">Guardar compra</button>
    </form>`);
}
/* caja de categoría con detección automática */
function catPickerHtml(prefix, cat, sub){
  const catOpts=CATS.filter(c=>!['Sueldo','Ahorro','Pago tarjeta'].includes(c.name)).map(c=>`<option value="${c.name}"${c.name===cat?' selected':''}>${c.name}</option>`).join('');
  const subOpts=subsOf(cat||'Otros').map(s=>`<option value="${esc(s)}"${s===sub?' selected':''}>${esc(s)}</option>`).join('');
  const auto = cat ? `<p class="hint" id="${prefix}AutoHint" style="margin:0 0 8px;color:var(--nico-ink)">✨ Detectado: <b>${esc(cat)} › ${esc(sub)}</b> · puedes cambiarlo</p>` : `<p class="hint" id="${prefix}AutoHint" style="margin:0 0 8px">Escribe arriba y la categoría se detecta sola.</p>`;
  return `${auto}
    <div class="fld-row">
      <div class="fld"><label>Categoría</label><select id="${prefix}Cat" onchange="onCatChange('${prefix}')">${catOpts}</select></div>
      <div class="fld"><label>Subcategoría</label><select id="${prefix}Sub">${subOpts}</select></div>
    </div>`;
}
/* al escribir la descripción, detecta y rellena categoría+subcategoría */
function updateAutoCat(prefix){
  const desc=document.getElementById(prefix+'Desc').value;
  const hit=autoCat(desc);
  if(hit){
    document.getElementById(prefix+'CatBox').innerHTML=catPickerHtml(prefix,hit.cat,hit.sub);
  }
}
/* al cambiar la categoría manualmente, actualizar las subcategorías */
function onCatChange(prefix){
  const cat=document.getElementById(prefix+'Cat').value;
  const sub=subsOf(cat)[0];
  document.getElementById(prefix+'CatBox').innerHTML=catPickerHtml(prefix,cat,sub);
}
function saveBuy(e){
  e.preventDefault();
  const who=document.querySelector('input[name=bwho]:checked').value;
  const cat=document.getElementById('bCat')?document.getElementById('bCat').value:'Otros';
  const sub=document.getElementById('bSub')?document.getElementById('bSub').value:'Otros';
  const date=document.getElementById('bDate').value;
  const buy={
    id:uid(), desc:document.getElementById('bDesc').value.trim(),
    card:document.getElementById('bCard').value,
    amt:parseNum(document.getElementById('bAmt').value),
    who, cat, sub, date
  };
  // guardar en el mes de pago que le corresponde según el corte de la tarjeta
  const key=payMonthOf(date, buy.card);
  M(key).buys.push(buy);
  save(); closeModal(); renderCompras();
}
function delBuy(id){ Object.values(db.months).forEach(mo=>{ if(mo.buys) mo.buys=mo.buys.filter(b=>b.id!==id); }); save(); renderCompras(); }

/* ---- pago de tarjeta ---- */
let payCtx=null;
function openPayModal(cardId,who){
  const card=db.config.cards.find(c=>c.id===cardId);
  const parts=cardPersonParts(cardId,who);
  const other=who==='a'?'b':'a';
  const otherParts=cardPersonParts(cardId,other);
  const otherPending = otherParts.total>0.5 && !findPay(cardId,other);
  payCtx={cardId,who,other,amt:parts.total,otherAmt:otherParts.total,otherPending};
  const banks=bankOptions(who);
  openModal(`
    <div class="modal-h"><h3>Marcar pago</h3><button class="x" data-close>×</button></div>
    <form onsubmit="savePay(event)">
      <p class="hint" style="margin-bottom:12px">Vas a marcar como pagada la parte de <b>${esc(whoName(who))}</b> (${fmt(parts.total)}) de ${esc(card.name)}.</p>
      <div class="fld"><label>¿De qué cuenta sale la plata?</label><select id="pBank">${banks}</select></div>
      <div class="fld"><label>Fecha del pago</label><input type="date" id="pDate" value="${today()}"></div>
      ${otherPending?`<div class="fld" style="background:var(--ambos-soft);border-radius:11px;padding:12px 14px">
        <label style="display:flex;align-items:center;gap:9px;cursor:pointer;margin:0">
          <input type="checkbox" id="pWhole" style="width:auto" onchange="toggleWholeHint()">
          <span>También pagué la parte de ${esc(whoName(other))} (${fmt(otherParts.total)})</span>
        </label>
        <p class="hint" id="wholeHint" style="margin-top:7px">Si lo marcas, sale el total de tu cuenta y ${esc(whoName(other))} te queda debiendo su parte hasta que te reembolse.</p>
      </div>`:''}
      <button type="submit" class="btn">Confirmar pago</button>
    </form>`);
}
function toggleWholeHint(){ /* visual only */ }
function bankOptions(who){
  // bancos únicos usados en los movimientos de la persona + opciones comunes
  const used=new Set();
  Object.values(db.months).forEach(mo=>{ (mo.moves&&mo.moves[who]||[]).forEach(m=>{ if(m.bank)used.add(m.bank); }); });
  const common=who==='a'?['Bancolombia','Nu','Davivienda','Efectivo']:['Bancolombia','Global 66','Nequi','Uala','Efectivo'];
  common.forEach(b=>used.add(b));
  return [...used].map(b=>`<option value="${esc(b)}">${esc(b)}</option>`).join('');
}
function savePay(e){
  e.preventDefault();
  if(!payCtx)return;
  const bank=document.getElementById('pBank').value;
  const date=document.getElementById('pDate').value;
  const whole = document.getElementById('pWhole') && document.getElementById('pWhole').checked;
  const card=db.config.cards.find(c=>c.id===payCtx.cardId);
  const mo=M();

  // registro del pago (mi parte)
  mo.pays.push({card:payCtx.cardId, who:payCtx.who, acc:bank, date, reimbursedOther:!!whole});
  // movimiento automático en mi libro: salida por mi parte (o total si pagué todo)
  const outAmt = whole ? (payCtx.amt+payCtx.otherAmt) : payCtx.amt;
  mo.moves[payCtx.who].push({
    id:uid(), auto:true, date, desc:`Pago ${card.name}${whole?' (ambas partes)':''}`,
    cat:'Tarjetas', bank, dir:-1, amt:outAmt, linkCard:payCtx.cardId
  });
  // si pagué la parte del otro, marcarla como pagada también (atada) y dejar reembolso pendiente
  if(whole){
    mo.pays.push({card:payCtx.cardId, who:payCtx.other, acc:bank, date, paidByOther:payCtx.who});
    // reembolso pendiente: NO entra a mi saldo hasta que me paguen
    mo.reimbursed[payCtx.cardId+'|'+payCtx.other]=false;
    // registrar en "Entre nosotros" como deuda directa (no se reparte)
    mo.settle.push({
      id:uid(), direct:true, linkCard:payCtx.cardId,
      concept:`Pago ${card.name} (parte de ${whoName(payCtx.other)})`,
      who:payCtx.who, amt:payCtx.otherAmt
    });
  }
  payCtx=null;
  save(); closeModal(); renderCompras();
}
function togglePay(cardId,who){
  const mo=M();
  const pay=mo.pays.find(x=>x.card===cardId&&x.who===who);
  if(!pay)return;
  // si este pago cubría ambas partes, quitar los dos y el movimiento auto
  if(pay.reimbursedOther){
    const other=who==='a'?'b':'a';
    mo.pays=mo.pays.filter(x=>!(x.card===cardId&&(x.who===who||x.who===other)));
    delete mo.reimbursed[cardId+'|'+other];
  } else if(pay.paidByOther){
    // es la parte que pagó el otro; no se puede deshacer sola, deshacer el principal
    mo.pays=mo.pays.filter(x=>!(x.card===cardId&&(x.who===who||x.who===pay.paidByOther)));
    delete mo.reimbursed[cardId+'|'+who];
  } else {
    mo.pays=mo.pays.filter(x=>!(x.card===cardId&&x.who===who));
  }
  // quitar movimientos auto ligados a esta tarjeta
  mo.moves.a=mo.moves.a.filter(m=>!(m.auto&&m.linkCard===cardId));
  mo.moves.b=mo.moves.b.filter(m=>!(m.auto&&m.linkCard===cardId));
  // quitar la deuda directa que generó en "Entre nosotros"
  mo.settle=mo.settle.filter(s=>!(s.direct&&s.linkCard===cardId));
  save(); renderCompras();
}

/* ---- movimiento propio ---- */
function openMoveModal(){
  const who=cuentasPerson;
  const catOpts=CATS.map(c=>`<option value="${c.name}">${c.name}</option>`).join('');
  openModal(`
    <div class="modal-h"><h3>Movimiento de ${esc(whoName(who))}</h3><button class="x" data-close>×</button></div>
    <form onsubmit="saveMove(event)">
      <div class="fld"><label>¿Entra o sale?</label>
        <div class="choice">
          <label><input type="radio" name="mdir" value="-1" checked><span>Sale (gasto)</span></label>
          <label><input type="radio" name="mdir" value="1"><span>Entra (ingreso)</span></label>
        </div>
      </div>
      <div class="fld"><label>Descripción</label><input id="mDesc" required placeholder="Ej: Almuerzo" oninput="updateAutoCat('m')" autocomplete="off"></div>
      <div class="fld-row">
        <div class="fld"><label>Valor</label><input id="mAmt" inputmode="numeric" required placeholder="0"></div>
        <div class="fld"><label>Fecha</label><input type="date" id="mDate" value="${today()}"></div>
      </div>
      <div id="mCatBox">${moveCatPicker('','')}</div>
      <div class="fld"><label>¿De qué cuenta?</label>${accSelect('mAcc',who)}</div>
      <p class="hint">Afecta el saldo de esa cuenta. Para pasar plata a tus ahorros, usa el botón «Transferir».</p>
      <button type="submit" class="btn">Guardar movimiento</button>
    </form>`);
}
/* selector de cuentas de una persona (sus propias + compartidas) */
function accSelect(id,who,selectedId){
  const accs=(db.config.accounts||[]).filter(a=>a.who===who||a.who==='shared');
  if(!accs.length) return `<input id="${id}" placeholder="Nombre del banco…" data-nobank="1">`;
  return `<select id="${id}">${accs.map(a=>`<option value="${a.id}"${a.id===selectedId?' selected':''}>${esc(a.name)}${a.cur==='USD'?' (USD)':''}</option>`).join('')}</select>`;
}
/* picker de categoría para movimientos (incluye Sueldo/Ahorro) */
function moveCatPicker(cat,sub){
  const catOpts=CATS.map(c=>`<option value="${c.name}"${c.name===cat?' selected':''}>${c.name}</option>`).join('');
  const subOpts=subsOf(cat||'Otros').map(s=>`<option value="${esc(s)}"${s===sub?' selected':''}>${esc(s)}</option>`).join('');
  const auto = cat ? `<p class="hint" id="mAutoHint" style="margin:0 0 8px;color:var(--nico-ink)">✨ Detectado: <b>${esc(cat)} › ${esc(sub)}</b> · puedes cambiarlo</p>` : `<p class="hint" id="mAutoHint" style="margin:0 0 8px">Escribe arriba y la categoría se detecta sola.</p>`;
  return `${auto}
    <div class="fld-row">
      <div class="fld"><label>Categoría</label><select id="mCat" onchange="onMoveCatChange()">${catOpts}</select></div>
      <div class="fld"><label>Subcategoría</label><select id="mSub">${subOpts}</select></div>
    </div>`;
}
function onMoveCatChange(){ const cat=document.getElementById('mCat').value; document.getElementById('mCatBox').innerHTML=moveCatPicker(cat,subsOf(cat)[0]); }
/* override de updateAutoCat para el prefijo 'm' que usa moveCatPicker */
const _updateAutoCat=updateAutoCat;
updateAutoCat=function(prefix){
  if(prefix==='m'){
    const hit=autoCat(document.getElementById('mDesc').value);
    if(hit) document.getElementById('mCatBox').innerHTML=moveCatPicker(hit.cat,hit.sub);
    return;
  }
  _updateAutoCat(prefix);
};
function saveMove(e){
  e.preventDefault();
  const who=cuentasPerson;
  const accEl=document.getElementById('mAcc');
  const isSelect = accEl && accEl.tagName==='SELECT';
  const accId = isSelect ? accEl.value : null;
  const bankName = isSelect ? (accById(accId)||{}).name : (accEl?accEl.value.trim():'');
  M().moves[who].push({
    id:uid(), auto:false,
    date:document.getElementById('mDate').value,
    desc:document.getElementById('mDesc').value.trim(),
    cat:document.getElementById('mCat').value,
    sub:document.getElementById('mSub')?document.getElementById('mSub').value:'',
    acc:accId, bank:bankName,
    dir:parseInt(document.querySelector('input[name=mdir]:checked').value),
    amt:parseNum(document.getElementById('mAmt').value)
  });
  save(); closeModal(); renderCuentas();
}
function delMove(who,id){ M().moves[who]=M().moves[who].filter(m=>m.id!==id); save(); renderCuentas(); }

/* ---- transferencias entre cuentas ---- */
function openTransferModal(){
  const accs=db.config.accounts||[];
  if(accs.length<2){ alert('Necesitas al menos dos cuentas para transferir. Crea otra en Configuración.'); return; }
  const opts=sel=>accs.map(a=>`<option value="${a.id}"${a.id===sel?' selected':''}>${esc(a.name)}${a.cur==='USD'?' (USD)':''} · ${a.cur==='USD'?fmtUSD(accountBalance(a.id)):fmt(accountBalance(a.id))}</option>`).join('');
  openModal(`
    <div class="modal-h"><h3>Transferir entre cuentas</h3><button class="x" data-close>×</button></div>
    <form onsubmit="saveTransfer(event)">
      <div class="fld"><label>Desde (sale de)</label><select id="tFrom" onchange="updateTransferConv()">${opts(accs[0].id)}</select></div>
      <div class="fld"><label>Hacia (entra a)</label><select id="tTo" onchange="updateTransferConv()">${opts(accs[1].id)}</select></div>
      <div class="fld"><label id="tAmtLabel">Monto</label><input id="tAmt" inputmode="numeric" required placeholder="0"></div>
      <div class="fld" id="tConvFld" hidden>
        <label id="tConvLabel">¿Cuánto te quedó? (lo que dice el banco)</label>
        <input id="tAmtDest" inputmode="numeric" placeholder="0">
        <p class="hint">Como cambias de moneda, escribe el valor final que te cargó el banco.</p>
      </div>
      <div class="fld"><label>Fecha</label><input type="date" id="tDate" value="${today()}"></div>
      <p class="hint">Solo mueve tu dinero de una cuenta a otra. No cuenta como gasto ni ingreso.</p>
      <button type="submit" class="btn">Transferir</button>
    </form>`);
  updateTransferConv();
}
function updateTransferConv(){
  const from=document.getElementById('tFrom').value, to=document.getElementById('tTo').value;
  const cf=accCur(from), ct=accCur(to);
  const conv=document.getElementById('tConvFld');
  document.getElementById('tAmtLabel').textContent='Monto que sale'+(cf==='USD'?' (USD)':'');
  if(cf!==ct){ conv.hidden=false; document.getElementById('tConvLabel').textContent='¿Cuánto te quedó en '+ct+'? (lo que dice el banco)'; }
  else conv.hidden=true;
}
function saveTransfer(e){
  e.preventDefault();
  const from=document.getElementById('tFrom').value, to=document.getElementById('tTo').value;
  const amt=parseNum(document.getElementById('tAmt').value);
  if(from===to){ alert('Elige dos cuentas distintas.'); return; }
  if(amt<=0){ alert('Escribe un monto válido.'); return; }
  const cf=accCur(from), ct=accCur(to);
  let amtDest=amt;
  if(cf!==ct){ amtDest=parseNum(document.getElementById('tAmtDest').value); if(amtDest<=0){ alert('Escribe cuánto te quedó en '+ct+'.'); return; } }
  M().transfers.push({id:uid(), from, to, amt, amtDest, date:document.getElementById('tDate').value});
  save(); closeModal(); renderCuentas();
}

/* ============================================================
   ENTRE NOSOTROS (calculadora quién le debe a quién)
   settle item = {id, concept, who, amt, direct?}
     - normal: se reparte según proporción
     - direct:true: valor fijo que el otro debe completo (de pagar tarjeta entera)
   ============================================================ */
function renderEntre(){
  const el=document.getElementById('v-entre');
  const rows=M().settle;
  el.innerHTML=`
    <div class="sec-head">
      <div>
        <div class="sec-label">${esc(monthName(curMonthKey))}</div>
        <h2>Entre nosotros</h2>
        <p class="sub">Para cuando pagan cosas de su bolsillo y luego se reembolsan. Anota cada gasto y quién lo pagó; se reparte según la proporción y te dice quién le debe a quién.</p>
      </div>
    </div>
    <div class="card" style="padding:22px;max-width:760px">
      <div id="calcRows">${calcRowsHtml()}</div>
      <button class="btn ghost sm" style="margin-top:10px" onclick="addSettle()">+ Añadir gasto</button>
      <div id="calcResult" style="margin-top:20px">${calcResultHtml()}</div>
      <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn ghost sm" onclick="clearSettle()">Limpiar todo</button>
      </div>
    </div>`;
}
function calcRowsHtml(){
  const rows=M().settle;
  if(!rows.length) return '<p class="hint">Aún no hay gastos. Pulsa «Añadir gasto», o aparecerán solos cuando pagues una tarjeta completa.</p>';
  return rows.map((r,i)=>{
    if(r.direct){
      const deudor=r.who==='a'?whoName('b'):whoName('a');
      return `<div style="display:grid;grid-template-columns:1fr auto 30px;gap:8px;align-items:center;margin-bottom:8px;padding:10px 12px;background:var(--ambos-soft);border-radius:10px">
        <span style="font-size:13px"><b>${esc(r.concept||'Deuda directa')}</b><br><span style="font-size:11px;color:var(--ambos-ink)">${esc(deudor)} debe este monto completo · no se reparte</span></span>
        <span style="font-weight:600;font-size:13.5px;text-align:right;font-variant-numeric:tabular-nums">${fmt(r.amt)}</span>
        <button onclick="delSettle(${i})" title="Borrar cuando ya te pagó" style="background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:16px">×</button>
      </div>`;
    }
    return `<div style="display:grid;grid-template-columns:1fr 104px 120px 30px;gap:8px;align-items:center;margin-bottom:8px">
      <input value="${esc(r.concept||'')}" placeholder="Concepto" onchange="editSettle(${i},'concept',this.value)" style="padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;background:var(--bg);color:var(--ink)">
      <select onchange="editSettle(${i},'who',this.value)" style="padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;background:var(--bg);color:var(--ink)">
        <option value="a"${r.who==='a'?' selected':''}>${esc(whoName('a'))}</option>
        <option value="b"${r.who==='b'?' selected':''}>${esc(whoName('b'))}</option>
      </select>
      <input inputmode="numeric" value="${r.amt||''}" placeholder="Valor" onchange="editSettle(${i},'amt',this.value)" style="padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;background:var(--bg);color:var(--ink);text-align:right;font-variant-numeric:tabular-nums">
      <button onclick="delSettle(${i})" style="background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:16px">×</button>
    </div>`;
  }).join('');
}
function calcResultHtml(){
  const all=M().settle.filter(r=>r.amt>0);
  if(!all.length) return '';
  const p=pct();
  const nA=whoName('a'), nB=whoName('b');
  // 1) gastos normales (se reparten)
  const shared=all.filter(r=>!r.direct);
  let pagoA=0,pagoB=0;
  shared.forEach(r=>{ if(r.who==='a')pagoA+=r.amt; else pagoB+=r.amt; });
  const total=pagoA+pagoB;
  const tocaA=total*p.a, tocaB=total*p.b;
  let saldoA=pagoA-tocaA;
  // 2) deudas directas (valor fijo entero)
  const directs=all.filter(r=>r.direct);
  directs.forEach(r=>{ if(r.who==='a')saldoA+=r.amt; else saldoA-=r.amt; });
  // veredicto
  let verdict;
  if(Math.abs(saldoA)<1) verdict=`<div style="text-align:center;font-weight:600;color:var(--ok)">Están a mano ✓</div>`;
  else if(saldoA>0) verdict=`<div style="text-align:center;font-size:15px"><b>${esc(nB)}</b> le debe <b style="color:var(--ok)">${fmt(saldoA)}</b> a <b>${esc(nA)}</b></div>`;
  else verdict=`<div style="text-align:center;font-size:15px"><b>${esc(nA)}</b> le debe <b style="color:var(--ok)">${fmt(Math.abs(saldoA))}</b> a <b>${esc(nB)}</b></div>`;
  const directRows=directs.map(r=>`<div class="row"><span class="lab">${esc(r.concept||'Deuda directa')} <span style="font-size:11px;color:var(--ink-faint)">(fija)</span></span><span class="val">${r.who==='a'?esc(nB)+' debe ':esc(nA)+' debe '}${fmt(r.amt)}</span></div>`).join('');
  return `<div style="border-top:1px solid var(--line);padding-top:16px">
    <div class="rows" style="padding:0">
      <div class="row"><span class="lab">Gastos repartidos</span><span class="val">${fmt(total)}</span></div>
      <div class="row"><span class="lab">${esc(nA)} pagó</span><span class="val">${fmt(pagoA)}</span></div>
      <div class="row"><span class="lab">${esc(nB)} pagó</span><span class="val">${fmt(pagoB)}</span></div>
      <div class="row"><span class="lab">Le tocaba a ${esc(nA)} (${Math.round(p.a*100)}%)</span><span class="val">${fmt(tocaA)}</span></div>
      <div class="row"><span class="lab">Le tocaba a ${esc(nB)} (${Math.round(p.b*100)}%)</span><span class="val">${fmt(tocaB)}</span></div>
      ${directRows}
    </div>
    <div style="margin-top:14px;padding:14px;background:var(--surface-2);border-radius:11px">${verdict}</div>
  </div>`;
}
function refreshEntre(){ document.getElementById('calcRows').innerHTML=calcRowsHtml(); document.getElementById('calcResult').innerHTML=calcResultHtml(); }
function addSettle(){ M().settle.push({id:uid(),concept:'',who:'a',amt:0}); save(); refreshEntre(); }
function editSettle(i,field,val){ const r=M().settle[i]; if(!r)return; r[field]= field==='amt'?parseNum(val):val; save(); refreshEntre(); }
function delSettle(i){ M().settle.splice(i,1); save(); refreshEntre(); }
function clearSettle(){ if(!confirm('¿Limpiar todos los gastos de la calculadora?'))return; M().settle=[]; save(); refreshEntre(); }

/* ============================================================
   MIGRACIÓN desde formato viejo (app actual)
   ============================================================ */
function migrateOld(old){
  const fresh=blankDB();
  try{
    if(old.people){ fresh.config.people.a={name:old.people.a.name||'Nico',salary:old.people.a.income||0}; fresh.config.people.b={name:old.people.b.name||'Mari',salary:old.people.b.income||0}; }
    // tarjetas
    (old.cards||[]).forEach(c=>{ fresh.config.cards.push({id:c.id,name:c.name}); if(c.limit) fresh.config.cardLimits[c.id]=c.limit; });
    // compras → agrupar por mes de la fecha
    (old.expenses||[]).forEach(e=>{
      if(!e.pay) return; // solo las de tarjeta
      const key=(e.date||today()).slice(0,7);
      if(!fresh.months[key]) fresh.months[key]={buys:[],pays:[],reimbursed:{},moves:{a:[],b:[]},resumenExtra:{}};
      fresh.months[key].buys.push({id:e.id||uid(),desc:e.desc,card:e.pay,amt:e.amt,who:e.who,cat:e.cat,date:e.date});
    });
    // ingresos viejos → movimientos propios
    (old.incomes||[]).forEach(i=>{
      const key=(i.date||today()).slice(0,7); const who=i.who==='b'?'b':'a';
      if(!fresh.months[key]) fresh.months[key]={buys:[],pays:[],reimbursed:{},moves:{a:[],b:[]},resumenExtra:{}};
      if(who==='a'||who==='b') fresh.months[key].moves[who].push({id:uid(),date:i.date,desc:i.desc||'Ingreso',cat:'Sueldo',dir:1,amt:i.amt,auto:false});
    });
  }catch(err){ console.error('migración parcial',err); }
  return fresh;
}
